<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <title>Set your password · Webnox OS</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="ml-body sp-light">

  <div class="ml-bg" aria-hidden="true">
    <span class="ml-blob ml-blob-1"></span>
    <span class="ml-blob ml-blob-2"></span>
    <span class="ml-blob ml-blob-3"></span>
    <span class="ml-grid"></span>
  </div>

  <main class="ml-main">
    <section class="ml-card">

      <header class="ml-head">
        <svg class="ml-mark" viewBox="0 0 64 40" role="img" aria-label="Webnox OS">
          <defs>
            <linearGradient id="mlg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#22D3EE"/>
              <stop offset="1" stop-color="#8B5CF6"/>
            </linearGradient>
          </defs>
          <path d="M8 4l2.2 5.8L16 12l-5.8 2.2L8 20l-2.2-5.8L0 12l5.8-2.2z" fill="#22D3EE"/>
          <path d="M26 6h9l-9 28h-9zM42 6h9l-9 28h-9z" fill="url(#mlg)"/>
        </svg>
        <p class="ml-brand" id="spBrand">Webnox OS</p>
        <p class="ml-tier" id="spTier">Set your password</p>
      </header>

      <p class="ml-wait" id="spWait">Checking your link…</p>

      <form class="ml-form" id="spForm" novalidate autocomplete="on" hidden>
        <input type="text" name="username" autocomplete="username" hidden>

        <div class="ml-field">
          <label class="ml-label" for="spPass">New password</label>
          <div class="ml-pass">
            <input class="ml-input" id="spPass" name="password" type="password"
                   autocomplete="new-password" required>
            <button class="ml-eye" id="spEye" type="button"
                    aria-label="Show password" aria-pressed="false">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="ml-field">
          <label class="ml-label" for="spPass2">Confirm password</label>
          <input class="ml-input" id="spPass2" name="confirm" type="password"
                 autocomplete="new-password" required>
        </div>

        <p class="ml-hint">At least 10 characters, with letters and a number.</p>

        <button class="ml-submit" id="spSubmit" type="submit" style="margin-top:0">
          <span class="ml-submit-text">Save password</span>
          <span class="ml-spin" aria-hidden="true"></span>
        </button>
      </form>

      <p class="ml-error" id="spError" role="alert" aria-live="polite" hidden></p>
      <p class="ml-ok" id="spOk" role="status" hidden>Password saved. You can now sign in with it.</p>
      <button class="ml-submit ml-go" id="spGo" type="button" hidden>Go to sign in</button>

    </section>
  </main>
  <p class="sp-foot" id="spFoot">Powered by Webnox OS</p>

  <script type="module">
    import { initSetPassword } from '/js/auth.js';
    initSetPassword();
  </script>
</body>
</html>
